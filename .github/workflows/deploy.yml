name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        env:
          VITE_BOOKING_URL: ${{ vars.VITE_BOOKING_URL }}
          VITE_BOOKING_URL_GRACEVILLE: ${{ vars.VITE_BOOKING_URL_GRACEVILLE }}
          VITE_BOOKING_URL_CIVIC: ${{ vars.VITE_BOOKING_URL_CIVIC }}
          VITE_STAFF_CSV_URL: ${{ vars.VITE_STAFF_CSV_URL }}
        run: npm run build

      - name: Deploy Graceville Fiveways to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 103.254.137.129
          username: git-login@fivewaysvet.com.au
          password: ${{ secrets.FTP_FIVE_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./dist/
          server-dir: ../

      - name: Deploy Civic Centre to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 103.254.137.129
          username: git-login@civiccentrevets.com.au
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./dist/
          server-dir: ../
